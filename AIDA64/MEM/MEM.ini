[Rainmeter]
Update=#UpdateMs#
AccurateText=1
DynamicWindowSize=1
@include=#@#Variables.inc
@include2=#@#Styles.inc

[MeasureMEMClock]
Measure=Registry
RegHKey=HKEY_CURRENT_USER
RegKey=#AIDAKey#
RegValue=#AIDA_MEMClock#

[MeasureMEMUtil]
Measure=Registry
RegHKey=HKEY_CURRENT_USER
RegKey=#AIDAKey#
RegValue=#AIDA_MEMUtil#
MinValue=0
MaxValue=100

[MeasureMEMUsed]
Measure=Registry
RegHKey=HKEY_CURRENT_USER
RegKey=#AIDAKey#
RegValue=#AIDA_MEMUsed#

[MeasureMEMFree]
Measure=Registry
RegHKey=HKEY_CURRENT_USER
RegKey=#AIDAKey#
RegValue=#AIDA_MEMFree#

[MeasureMEMTotal]
Measure=Calc
Formula=MeasureMEMUsed + MeasureMEMFree
DynamicVariables=1

[MeterBg]
Meter=Shape
MeterStyle=StyleBg

[MeterTitle]
Meter=String
MeterStyle=StyleTitle
Text=MEM

[Divider]
Meter=Image
MeterStyle=StyleDivider
X=#DividerX#
Y=#DividerY#


[LabelClock]
Meter=String
MeterStyle=StyleLabel
Y=(#LineH#*2)
Text=Clock

[ValueClock]
Meter=String
MeterStyle=StyleValue
MeasureName=MeasureMEMClock
Y=(#LineH#*2)
Text=%1 MHz

[LabelMEM]
Meter=String
MeterStyle=StyleLabel
Y=(#LineH#*3)
Text=Memory

[ValueMEM]
Meter=String
MeterStyle=StyleValue
MeasureName=MeasureMEMUsed
MeasureName2=MeasureMEMTotal
Y=(#LineH#*3)
Text=%1 / %2 MB

[BarMEMBg]
Meter=Image
MeterStyle=StyleBarBg
Y=((#LineH#*3)+#BarOffsetY#)

[BarMEM]
Meter=Bar
MeasureName=MeasureMEMUtil
MeterStyle=StyleBar
Y=((#LineH#*3)+#BarOffsetY#)


[GraphMEMBg]
Meter=Shape
Shape=Rectangle #GraphX#,#GraphY#,#GraphW#,#GraphH#,#GraphRadius# | Fill Color #ColorGraphBg# | StrokeWidth 1 | Stroke Color #ColorBorder#

[GraphMEM]
Meter=Line
MeasureName=MeasureMEMUtil
MeterStyle=StyleGraphLine
Y=#GraphY#
