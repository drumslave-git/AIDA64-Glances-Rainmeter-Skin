[Rainmeter]
Update=#UpdateMs#
AccurateText=1
DynamicWindowSize=1
@include=#@#Variables.inc
@include2=#@#Styles.inc

[MeasureFPS]
Measure=Registry
RegHKey=HKEY_CURRENT_USER
RegKey=#AIDAKey#
RegValue=#AIDA_FPS#

[MeterBg]
Meter=Shape
MeterStyle=StyleBg

[MeterTitle]
Meter=String
MeterStyle=StyleTitle
Text=FPS

[Divider]
Meter=Image
MeterStyle=StyleDivider
X=#DividerX#
Y=#DividerY#

; -------------------------
; FPS value (centered between divider and graph)
; -------------------------

[ValueFPS]
Meter=String
MeasureName=MeasureFPS
X=(#PanelWidth#/2)
Y=((#DividerY#+#GraphY#)/2)
FontFace=#FontName#
FontSize=90
FontColor=#ColorText#
AntiAlias=1
StringAlign=CenterCenter
Text=%1

; -------------------------
; FPS graph (anchored to bottom of panel via shared #GraphY#)
; -------------------------

[GraphFPSBg]
Meter=Shape
Shape=Rectangle #GraphX#,#GraphY#,#GraphW#,#GraphH#,#GraphRadius# | Fill Color #ColorGraphBg# | StrokeWidth 1 | Stroke Color #ColorBorder#

[GraphFPS]
Meter=Line
MeasureName=MeasureFPS
MeterStyle=StyleGraphLineAuto
Y=#GraphY#
LineCount=1
LineColor=#ColorGraph3#
AutoScale=1
