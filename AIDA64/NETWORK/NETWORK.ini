[Rainmeter]
Update=#UpdateMs#
AccurateText=1
DynamicWindowSize=1
@include=#@#Variables.inc
@include2=#@#Styles.inc

[MeasureNetIn]
Measure=NetIn
Interface=Best
MinValue=0

[MeasureNetOut]
Measure=NetOut
Interface=Best
MinValue=0

[MeasureNetInMbit]
Measure=Calc
Formula=MeasureNetIn * 8 / 1000000
DynamicVariables=1

[MeasureNetOutMbit]
Measure=Calc
Formula=MeasureNetOut * 8 / 1000000
DynamicVariables=1

[MeterBg]
Meter=Shape
MeterStyle=StyleBg

[MeterTitle]
Meter=String
MeterStyle=StyleTitle
Text=NETWORK

[Divider]
Meter=Image
MeterStyle=StyleDivider
X=#DividerX#
Y=#DividerY#


[LabelIn]
Meter=String
MeterStyle=StyleLabel
Y=(#LineH#*2)
Text=Download

[ValueIn]
Meter=String
MeterStyle=StyleValue
MeasureName=MeasureNetInMbit
Y=(#LineH#*2)
Text=%1 Mbps
NumOfDecimals=2

[LabelOut]
Meter=String
MeterStyle=StyleLabel
Y=(#LineH#*3)
Text=Upload

[ValueOut]
Meter=String
MeterStyle=StyleValue
MeasureName=MeasureNetOutMbit
Y=(#LineH#*3)
Text=%1 Mbps
NumOfDecimals=2


[GraphNetworkBg]
Meter=Shape
Shape=Rectangle #GraphX#,#GraphY#,#GraphW#,#GraphH#,#GraphRadius# | Fill Color #ColorGraphBg# | StrokeWidth 1 | Stroke Color #ColorBorder#

[GraphNetwork]
Meter=Line
MeasureName=MeasureNetInMbit
MeasureName2=MeasureNetOutMbit
MeterStyle=StyleGraphLineAuto
Y=#GraphY#
LineCount=2
LineColor=#ColorGraph1#
LineColor2=#ColorGraph2#
AutoScale=1
