[Rainmeter]
Update=#UpdateMs#
AccurateText=1
DynamicWindowSize=1
@include=#@#Variables.inc
@include2=#@#Styles.inc

[MeasureCPUClock]
Measure=Registry
RegHKey=HKEY_CURRENT_USER
RegKey=#AIDAKey#
RegValue=#AIDA_CPUClock#

[MeasureCPUUtil]
Measure=Registry
RegHKey=HKEY_CURRENT_USER
RegKey=#AIDAKey#
RegValue=#AIDA_CPUUtil#
MinValue=0
MaxValue=100

[MeasureCPUTemp]
Measure=Registry
RegHKey=HKEY_CURRENT_USER
RegKey=#AIDAKey#
RegValue=#AIDA_CPUTemp#

[MeterBg]
Meter=Shape
MeterStyle=StyleBg

[MeterTitle]
Meter=String
MeterStyle=StyleTitle
Text=CPU

[Divider]
Meter=Image
MeterStyle=StyleDivider
X=#DividerX#
Y=#DividerY#


[LabelClock]
Meter=String
MeterStyle=StyleLabel
Y=(#LineH#*2)
Text=Clock

[ValueClock]
Meter=String
MeterStyle=StyleValue
MeasureName=MeasureCPUClock
Y=(#LineH#*2)
Text=%1 MHz

[LabelUtil]
Meter=String
MeterStyle=StyleLabel
Y=(#LineH#*3)
Text=Utilization

[ValueUtil]
Meter=String
MeterStyle=StyleValue
MeasureName=MeasureCPUUtil
Y=(#LineH#*3)
Text=%1%

[BarUtilBg]
Meter=Image
MeterStyle=StyleBarBg
Y=((#LineH#*3)+#BarOffsetY#)

[BarUtil]
Meter=Bar
MeasureName=MeasureCPUUtil
MeterStyle=StyleBar
Y=((#LineH#*3)+#BarOffsetY#)

[LabelTemp]
Meter=String
MeterStyle=StyleLabel
Y=(#LineH#*4)
Text=Temperature

[ValueTemp]
Meter=String
MeterStyle=StyleValue
MeasureName=MeasureCPUTemp
Y=(#LineH#*4)
Text=%1 °C


[GraphUtilBg]
Meter=Shape
Shape=Rectangle #GraphX#,#GraphY#,#GraphW#,#GraphH#,#GraphRadius# | Fill Color #ColorGraphBg# | StrokeWidth 1 | Stroke Color #ColorBorder#

[GraphUtil]
Meter=Line
MeasureName=MeasureCPUUtil
MeterStyle=StyleGraphLine
Y=#GraphY#
