[Rainmeter]
Update=#UpdateMs#
AccurateText=1
DynamicWindowSize=1
@include=#@#Variables.inc
@include2=#@#Styles.inc

[GPUApi]
Measure=WebParser
URL=#GlancesGPUUrl#
UpdateRate=#GlancesUpdateRate#
RegExp=(?si).*"name"\s*:\s*"([^"]+)".*"mem"\s*:\s*(null|[0-9.]+).*"proc"\s*:\s*(null|[0-9.]+).*
SSLVerify=#GlancesSSLVerify#

[GPUName]
Measure=WebParser
URL=[GPUApi]
StringIndex=1

[GPUMemPercent]
Measure=WebParser
URL=[GPUApi]
StringIndex=2
Substitute="null":"0"
MinValue=0
MaxValue=100

[GPUProcPercent]
Measure=WebParser
URL=[GPUApi]
StringIndex=3
Substitute="null":"0"
MinValue=0
MaxValue=100

[MeterBg]
Meter=Shape
MeterStyle=StyleBg

[MeterTitle]
Meter=String
MeterStyle=StyleTitle
Text=GPU

[Divider]
Meter=Image
MeterStyle=StyleDivider
X=#DividerX#
Y=#DividerY#

[ValueName]
Meter=String
MeterStyle=StyleLabel
Y=(#LineH#*2)
W=(#PanelWidth#-(#Padding#*2))
ClipString=2
MeasureName=GPUName
Text=%1

[LabelUtil]
Meter=String
MeterStyle=StyleLabel
Y=(#LineH#*3)
Text=Utilization

[ValueUtil]
Meter=String
MeterStyle=StyleValue
Y=(#LineH#*3)
DynamicVariables=1
Text=[GPUProcPercent:0]%

[BarUtilBg]
Meter=Image
MeterStyle=StyleBarBg
Y=((#LineH#*3)+#BarOffsetY#)

[BarUtil]
Meter=Bar
MeterStyle=StyleBar
Y=((#LineH#*3)+#BarOffsetY#)
MeasureName=GPUProcPercent

[LabelVRAM]
Meter=String
MeterStyle=StyleLabel
Y=(#LineH#*4)
Text=VRAM

[ValueVRAM]
Meter=String
MeterStyle=StyleValue
Y=(#LineH#*4)
DynamicVariables=1
Text=[GPUMemPercent:1]%

[BarVRAMBg]
Meter=Image
MeterStyle=StyleBarBg
Y=((#LineH#*4)+#BarOffsetY#)

[BarVRAM]
Meter=Bar
MeterStyle=StyleBar
Y=((#LineH#*4)+#BarOffsetY#)
MeasureName=GPUMemPercent

[GraphVRAMBg]
Meter=Shape
Shape=Rectangle #GraphX#,#GraphY#,#GraphW#,#GraphH#,#GraphRadius# | Fill Color #ColorGraphBg# | StrokeWidth 1 | Stroke Color #ColorBorder#

[GraphVRAM]
Meter=Line
MeterStyle=StyleGraphLine
Y=#GraphY#
MeasureName=GPUMemPercent
LineCount=1
LineColor=#ColorGraph1#
