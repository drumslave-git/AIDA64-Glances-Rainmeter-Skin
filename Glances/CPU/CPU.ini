[Rainmeter]
Update=#UpdateMs#
AccurateText=1
DynamicWindowSize=1
@include=#@#Variables.inc
@include2=#@#Styles.inc

[CPUApi]
Measure=WebParser
URL=#GlancesCPUUrl#
UpdateRate=#GlancesUpdateRate#
RegExp="total"\s*:\s*([0-9.]+).*?"cpucore"\s*:\s*([0-9]+)
SSLVerify=#GlancesSSLVerify#

[CPUTotal]
Measure=WebParser
URL=[CPUApi]
StringIndex=1
MinValue=0
MaxValue=100

[CPUCores]
Measure=WebParser
URL=[CPUApi]
StringIndex=2

[MeterBg]
Meter=Shape
MeterStyle=StyleBg

[MeterTitle]
Meter=String
MeterStyle=StyleTitle
Text=CPU

[Divider]
Meter=Image
MeterStyle=StyleDivider
X=#DividerX#
Y=#DividerY#


[LabelUtil]
Meter=String
MeterStyle=StyleLabel
Y=(#LineH#*2)
Text=Utilization

[ValueUtil]
Meter=String
MeterStyle=StyleValue
Y=(#LineH#*2)
DynamicVariables=1
Text=[CPUTotal:0]%

[BarUtilBg]
Meter=Image
MeterStyle=StyleBarBg
Y=((#LineH#*2)+#BarOffsetY#)

[BarUtil]
Meter=Bar
MeterStyle=StyleBar
Y=((#LineH#*2)+#BarOffsetY#)
MeasureName=CPUTotal

[LabelCores]
Meter=String
MeterStyle=StyleLabel
Y=(#LineH#*3)
Text=Cores

[ValueCores]
Meter=String
MeterStyle=StyleValue
Y=(#LineH#*3)
MeasureName=CPUCores
Text=%1


[GraphUtilBg]
Meter=Shape
Shape=Rectangle #GraphX#,#GraphY#,#GraphW#,#GraphH#,#GraphRadius# | Fill Color #ColorGraphBg# | StrokeWidth 1 | Stroke Color #ColorBorder#

[GraphUtil]
Meter=Line
MeterStyle=StyleGraphLine
Y=#GraphY#
MeasureName=CPUTotal
