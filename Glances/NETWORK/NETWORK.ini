[Rainmeter]
Update=#UpdateMs#
AccurateText=1
DynamicWindowSize=1
@include=#@#Variables.inc
@include2=#@#Styles.inc

[NetApi]
Measure=WebParser
URL=#GlancesNETWORKUrl#
UpdateRate=#GlancesUpdateRate#
RegExp=(?si).*"speed"\s*:\s*([0-9]+).*"bytes_recv_rate_per_sec"\s*:\s*([0-9.]+).*"bytes_sent_rate_per_sec"\s*:\s*([0-9.]+).*
SSLVerify=#GlancesSSLVerify#

[NetSpeedBps]
Measure=WebParser
URL=[NetApi]
StringIndex=1

[NetDownBps]
Measure=WebParser
URL=[NetApi]
StringIndex=2

[NetUpBps]
Measure=WebParser
URL=[NetApi]
StringIndex=3

[NetSpeedMbit]
Measure=Calc
Formula=NetSpeedBps / 1000000
DynamicVariables=1

[NetDownMbit]
Measure=Calc
Formula=NetDownBps * 8 / 1000000
DynamicVariables=1

[NetUpMbit]
Measure=Calc
Formula=NetUpBps * 8 / 1000000
DynamicVariables=1

[MeterBg]
Meter=Shape
MeterStyle=StyleBg

[MeterTitle]
Meter=String
MeterStyle=StyleTitle
Text=NETWORK

[Divider]
Meter=Image
MeterStyle=StyleDivider
X=#DividerX#
Y=#DividerY#


[LabelSpeed]
Meter=String
MeterStyle=StyleLabel
Y=(#LineH#*2)
Text=Link

[ValueSpeed]
Meter=String
MeterStyle=StyleValue
Y=(#LineH#*2)
MeasureName=NetSpeedMbit
Text=%1 Mbps
NumOfDecimals=0

[LabelDown]
Meter=String
MeterStyle=StyleLabel
Y=(#LineH#*3)
Text=Download

[ValueDown]
Meter=String
MeterStyle=StyleValue
Y=(#LineH#*3)
MeasureName=NetDownMbit
Text=%1 Mbps
NumOfDecimals=2

[LabelUp]
Meter=String
MeterStyle=StyleLabel
Y=(#LineH#*4)
Text=Upload

[ValueUp]
Meter=String
MeterStyle=StyleValue
Y=(#LineH#*4)
MeasureName=NetUpMbit
Text=%1 Mbps
NumOfDecimals=2


[GraphNetworkBg]
Meter=Shape
Shape=Rectangle #GraphX#,#GraphY#,#GraphW#,#GraphH#,#GraphRadius# | Fill Color #ColorGraphBg# | StrokeWidth 1 | Stroke Color #ColorBorder#

[GraphNetwork]
Meter=Line
MeterStyle=StyleGraphLineAuto
Y=#GraphY#
MeasureName=NetDownMbit
MeasureName2=NetUpMbit
LineCount=2
LineColor=#ColorGraph1#
LineColor2=#ColorGraph2#
AutoScale=1
