; --- Diagnostic footer (set ScriptProc Debug=0 to silence the log; remove this meter to hide) ---

[StatusLine]
Meter=String
MeterStyle=StyleStatus
X=#Padding#
Y=#StatusY#
W=(#PanelWidth#-(#Padding#*2))
DynamicVariables=1
Text=[&ScriptProc:GetStatus()]
