[Rainmeter]
Update=#UpdateMs#
AccurateText=1
DynamicWindowSize=1
@include=#@#Variables.inc
@include2=#@#Styles.inc

[Variables]
; Wider tile to give the cmdline column room.
CELLS_COUNT=2

ColGap=14
ProcNameW=300
ProcValReservedW=160
ProcCmdX=(#Padding#+#ProcNameW#+#ColGap#)
ProcValRight=(#PanelWidth#-#Padding#)
ProcCmdW=(#ProcValRight#-#ProcValReservedW#-#ColGap#-#ProcCmdX#)

StatusY=(#PanelHeight#-16)

[StyleProcName]
FontFace=#FontName#
FontSize=14
FontColor=#ColorMuted#
AntiAlias=1
StringAlign=Left
ClipString=2

[StyleProcCmdline]
FontFace=#FontName#
FontSize=11
FontColor=#ColorMuted#
AntiAlias=1
StringAlign=Left
ClipString=2

[StyleStatus]
FontFace=#FontName#
FontSize=7
FontColor=#ColorMuted#
AntiAlias=1
StringAlign=Left
ClipString=2

; --- Data source: fetch Glances /processlist/top/N JSON, parse + sort in Lua ---

[GlancesProcessListApi]
Measure=WebParser
URL=#GlancesPROCESSESUrl#
UpdateRate=#GlancesUpdateRate#
RegExp=(?s)^(.+)$
SSLVerify=#GlancesSSLVerify#

[GlancesProcessListJson]
Measure=WebParser
URL=[GlancesProcessListApi]
StringIndex=1

[ScriptProc]
Measure=Script
ScriptFile=#@#Scripts\GlancesProcesses.lua
SourceMeasure=GlancesProcessListJson
SortField=rss
TopCount=5
Blacklist=#GlancesProcBlacklist#
Debug=1
UpdateDivider=1

; --- Layout ---

[MeterBg]
Meter=Shape
MeterStyle=StyleBg

[MeterTitle]
Meter=String
MeterStyle=StyleTitle
Text=PROCESSES MEM

[Divider]
Meter=Image
MeterStyle=StyleDivider
X=#DividerX#
Y=#DividerY#

[Proc1Name]
Meter=String
MeterStyle=StyleProcName
X=#Padding#
Y=(#LineH#*2)
W=#ProcNameW#
DynamicVariables=1
Text=[&ScriptProc:GetName(1)]

[Proc1Cmd]
Meter=String
MeterStyle=StyleProcCmdline
X=#ProcCmdX#
Y=(#LineH#*2)
W=#ProcCmdW#
DynamicVariables=1
Text=[&ScriptProc:GetCmdline(1)]

[Proc1Val]
Meter=String
MeterStyle=StyleValue
X=#ProcValRight#
Y=(#LineH#*2)
FontSize=18
DynamicVariables=1
Text=[&ScriptProc:GetRssHuman(1)]B

[Proc2Name]
Meter=String
MeterStyle=StyleProcName
X=#Padding#
Y=(#LineH#*3)
W=#ProcNameW#
