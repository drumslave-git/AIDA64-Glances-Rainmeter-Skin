[Rainmeter]
Update=#UpdateMs#
AccurateText=1
DynamicWindowSize=1
@include=#@#Variables.inc
@include2=#@#Styles.inc

[MEMApi]
Measure=WebParser
URL=#GlancesMEMUrl#
UpdateRate=#GlancesUpdateRate#
RegExp=(?si).*"total"\s*:\s*([0-9]+).*"percent"\s*:\s*([0-9.]+).*"used"\s*:\s*([0-9]+).*
SSLVerify=#GlancesSSLVerify#

[MEMTotalBytes]
Measure=WebParser
URL=[MEMApi]
StringIndex=1

[MEMPercent]
Measure=WebParser
URL=[MEMApi]
StringIndex=2
MinValue=0
MaxValue=100

[MEMUsedBytes]
Measure=WebParser
URL=[MEMApi]
StringIndex=3

[MEMTotalGB]
Measure=Calc
Formula=MEMTotalBytes / 1073741824
DynamicVariables=1

[MEMUsedGB]
Measure=Calc
Formula=MEMUsedBytes / 1073741824
DynamicVariables=1

[MeterBg]
Meter=Shape
MeterStyle=StyleBg

[MeterTitle]
Meter=String
MeterStyle=StyleTitle
Text=MEM

[Divider]
Meter=Image
MeterStyle=StyleDivider
X=#DividerX#
Y=#DividerY#


[LabelMem]
Meter=String
MeterStyle=StyleLabel
Y=(#LineH#*2)
Text=Memory

[ValueMem]
Meter=String
MeterStyle=StyleValue
Y=(#LineH#*2)
MeasureName=MEMUsedGB
MeasureName2=MEMTotalGB
Text=%1 / %2 GB
NumOfDecimals=1

[BarMemBg]
Meter=Image
MeterStyle=StyleBarBg
Y=((#LineH#*2)+#BarOffsetY#)

[BarMem]
Meter=Bar
MeterStyle=StyleBar
Y=((#LineH#*2)+#BarOffsetY#)
MeasureName=MEMPercent


[GraphMEMBg]
Meter=Shape
Shape=Rectangle #GraphX#,#GraphY#,#GraphW#,#GraphH#,#GraphRadius# | Fill Color #ColorGraphBg# | StrokeWidth 1 | Stroke Color #ColorBorder#

[GraphMEM]
Meter=Line
MeterStyle=StyleGraphLine
Y=#GraphY#
MeasureName=MEMPercent
