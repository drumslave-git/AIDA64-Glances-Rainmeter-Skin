[NetTitle]
Meter=String
MeterStyle=StyleSecTitle
X=#B3LeftX#
Y=#B3Top#
Text=NETWORK

[NetDiv]
Meter=Image
SolidColor=#ColorDivider#
X=#B3LeftX#
Y=(#B3Top#+#SecTitleH#+4)
W=#B3LeftW#
H=1

[NetLabelLink]
Meter=String
MeterStyle=StyleSecLabel
X=#B3LeftX#
Y=#B3LinkY#
Text=Link

[NetValueLink]
Meter=String
MeterStyle=StyleSecValue
X=(#B3LeftX#+#B3LeftW#)
Y=#B3LinkY#
MeasureName=MeasureNetLinkMbit
Text=%1 Mbps
NumOfDecimals=0

[NetLabelDown]
Meter=String
MeterStyle=StyleSecLabel
X=#B3LeftX#
Y=#B3DownY#
Text=Download

[NetValueDown]
Meter=String
MeterStyle=StyleSecValue
X=(#B3LeftX#+#B3LeftW#)
Y=#B3DownY#
MeasureName=MeasureNetInMbit
Text=%1 Mbps
NumOfDecimals=2

[NetLabelUp]
Meter=String
MeterStyle=StyleSecLabel
X=#B3LeftX#
Y=#B3UpY#
Text=Upload

[NetValueUp]
Meter=String
MeterStyle=StyleSecValue
X=(#B3LeftX#+#B3LeftW#)
Y=#B3UpY#
MeasureName=MeasureNetOutMbit
Text=%1 Mbps
NumOfDecimals=2

[NetGraphBg]
Meter=Shape
Shape=Rectangle #B3GraphX#,#B3GraphY#,#B3GraphW#,#B3GraphH#,#GraphRadius# | Fill Color #ColorGraphBg# | StrokeWidth 1 | Stroke Color #ColorBorder#

[NetGraph]
Meter=Line
MeasureName=MeasureNetInMbit
MeasureName2=MeasureNetOutMbit
X=#B3GraphX#
Y=#B3GraphY#
W=#B3GraphW#
H=#B3GraphH#
LineCount=2
LineColor=#ColorGraph1#
LineColor2=#ColorGraph2#
LineWidth=2
AntiAlias=1
AutoScale=1
HorizontalLines=3
HorizontalLineColor=#ColorGraphGrid#

; ========================= PROCESSES =========================
[ProcTitle]
