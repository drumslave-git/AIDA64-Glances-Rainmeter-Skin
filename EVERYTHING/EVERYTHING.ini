; ========================= FPS =========================
[FpsTitle]
Meter=String
MeterStyle=StyleSecTitle
X=#Third2X#
Y=#B2Top#
Text=FPS

[FpsDiv]
Meter=Image
SolidColor=#ColorDivider#
X=#Third2X#
Y=(#B2Top#+#SecTitleH#+4)
W=#ThirdW#
H=1

[ValueFPS]
Meter=String
MeasureName=MeasureFPS
X=(#Third2X#+(#ColThirdW#/2))
Y=#B2FpsValueY#
FontFace=#FontName#
FontSize=64
FontColor=#ColorText#
AntiAlias=1
StringAlign=CenterCenter
Text=%1

[FpsGraphBg]
Meter=Shape
Shape=Rectangle #Third2X#,#B2GraphY#,#ThirdW#,#GraphH#,#GraphRadius# | Fill Color #ColorGraphBg# | StrokeWidth 1 | Stroke Color #ColorBorder#

[FpsGraph]
