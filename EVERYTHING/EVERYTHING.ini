[Rainmeter]
Update=#UpdateMs#
AccurateText=1
DynamicWindowSize=1
@include=#@#Variables.inc
@include2=#@#Styles.inc

[Variables]
CELLS_COUNT=4
ROWS_COUNT=4

; ---------- EVERYTHING layout grid (1920 x 1232) ----------
BandGap=8
B1Y=#Padding#
B1H=290
B2Y=(#B1Y#+#B1H#+#BandGap#)
B2H=250
B3Y=(#B2Y#+#B2H#+#BandGap#)
B3H=220
B4Y=(#B3Y#+#B3H#+#BandGap#)
B4H=0
B5Y=#B4Y#
B5H=(#PanelHeight#-#B5Y#-#Padding#)

ColHalfW=(#PanelWidth#/2)
ColThirdW=(#PanelWidth#/3)
Half1X=#Padding#
Half1W=(#ColHalfW#-(#Padding#*2))
Half2X=(#ColHalfW#+#Padding#)
Half2W=#Half1W#
Third1X=#Padding#
Third2X=#ColThirdW#
Third3X=(#ColThirdW#*2)
ThirdW=(#ColThirdW#-(#Padding#*2))
FullW=(#PanelWidth#-(#Padding#*2))
ColQuarterW=(#PanelWidth#/4)
Q1X=#Padding#
Q2X=(#ColQuarterW#+#Padding#)
Q3X=((#ColQuarterW#*2)+#Padding#)
Q4X=((#ColQuarterW#*3)+#Padding#)
QuarterW=(#ColQuarterW#-(#Padding#*2))

GraphH=56
GraphHSm=52
SecTitleH=26
SecHeadH=(#SecTitleH#+12)

; Band 1 — CPU / GPU (two util+temp graph stacks)
B1Top=(#B1Y#+12)
B1Util1Y=(#B1Top#+#SecHeadH#)
B1Util1BarY=(#B1Util1Y#+#BarOffsetY#)
B1Util1GraphY=(#B1Util1Y#+#LineH#+8)
B1Temp1Y=(#B1Util1GraphY#+#GraphH#+16)
B1Temp1GraphY=(#B1Temp1Y#+#LineH#+8)

; Band 2 — VRAM | FPS | MEM (graphs anchored to band bottom)
B2Top=(#B2Y#+12)
B2GraphY=(#B2Y#+#B2H#-#GraphH#-#Padding#)
B2FpsValueY=((#B2Top#+#SecHeadH#+#B2GraphY#)/2)
B2VramRowY=(#B2Top#+#SecHeadH#)
B2VramBarY=(#B2VramRowY#+#BarOffsetY#)
B2MemClockY=(#B2Top#+#SecHeadH#)
B2MemRowY=(#B2MemClockY#+#LineH#)
B2MemBarY=(#B2MemRowY#+#BarOffsetY#)

; Band 3 — local network + local top processes
B3Top=(#B3Y#+12)
B3LeftX=#Padding#
B3LeftW=(#ColHalfW#-(#Padding#*2))
B3RightX=(#ColHalfW#+#Padding#)
B3RightW=#B3LeftW#
B3GraphX=#B3LeftX#
B3GraphW=#B3LeftW#
B3GraphY=(#B3UpY#+#LineH#+4)
B3GraphH=(#B3Y#+#B3H#-#B3GraphY#-#Padding#)
B3LinkY=(#B3Top#+#SecHeadH#)
B3DownY=(#B3LinkY#+#LineH#)
B3UpY=(#B3DownY#+#LineH#)

B3ProcLabelX=#B3RightX#
B3ProcNameX=(#B3RightX#+80)
B3ProcValX=(#B3RightX#+#B3RightW#)
B3ProcNameW=(#B3ProcValX#-#B3ProcNameX#-140)

; Band 5 — Glances remote stats + processes
B5Top=(#B5Y#+12)
B5Row1Y=(#B5Top#+#SecHeadH#)
B5Bar1Y=(#B5Row1Y#+#BarOffsetY#)
B5Row2Y=(#B5Row1Y#+#LineH#)
B5Bar2Y=(#B5Row2Y#+#BarOffsetY#)
B5Row3Y=(#B5Row2Y#+#LineH#)
B5Bar3Y=(#B5Row3Y#+#BarOffsetY#)
B5GraphY=(#B5Bar3Y#+14)
B5ProcTop=(#B5GraphY#+#GraphHSm#+12)
B5ProcRowH=30
B5ProcRow1Y=(#B5ProcTop#+#SecHeadH#)
B5ProcRow2Y=(#B5ProcRow1Y#+#B5ProcRowH#)
B5ProcRow3Y=(#B5ProcRow2Y#+#B5ProcRowH#)

GProcColW=(#ColHalfW#-(#Padding#*2))
GProcCpuX=#Padding#
GProcMemX=(#ColHalfW#+#Padding#)
GProcNameW=220
GProcValReservedW=140
GProcCmdGap=12
GProcCmdW=(#GProcColW#-#GProcNameW#-#GProcValReservedW#-(#GProcCmdGap#*2))
GProcCpuCmdX=(#GProcCpuX#+#GProcNameW#+#GProcCmdGap#)
GProcMemCmdX=(#GProcMemX#+#GProcNameW#+#GProcCmdGap#)
GProcCpuValX=(#GProcCpuX#+#GProcColW#)
GProcMemValX=(#GProcMemX#+#GProcColW#)

ProcBlacklist=_Total|Idle|dwm|csrss|svchost|lsass|System|system|Memory Compression|wininit|spoolsv|Registry|Secure System

[StyleSecTitle]
FontFace=#FontName#
FontSize=22
FontColor=#ColorTitle#
StringStyle=Bold
AntiAlias=1
StringCase=Upper

[StyleSecLabel]
FontFace=#FontName#
FontSize=20
FontColor=#ColorText#
AntiAlias=1
StringAlign=Left

[StyleSecValue]
FontFace=#FontName#
FontSize=20
FontColor=#ColorText#
AntiAlias=1
StringAlign=Right

[StyleProcName]
FontFace=#FontName#
FontSize=20
FontColor=#ColorMuted#
AntiAlias=1
StringAlign=Left
ClipString=2

[StyleGlancesProcName]
FontFace=#FontName#
FontSize=16
FontColor=#ColorMuted#
AntiAlias=1
StringAlign=Left
ClipString=2

[StyleGlancesProcCmdline]
FontFace=#FontName#
FontSize=14
FontColor=#ColorMuted#
AntiAlias=1
StringAlign=Left
ClipString=2

[StyleGlancesProcValue]
FontFace=#FontName#
FontSize=16
FontColor=#ColorText#
AntiAlias=1
StringAlign=Right

; ---------- AIDA64 ----------
[MeasureCPUUtil]
Measure=Registry
RegHKey=HKEY_CURRENT_USER
RegKey=#AIDAKey#
RegValue=#AIDA_CPUUtil#
MinValue=0
MaxValue=100

[MeasureCPUTemp]
Measure=Registry
RegHKey=HKEY_CURRENT_USER
RegKey=#AIDAKey#
RegValue=#AIDA_CPUTemp#

[MeasureGPUUtil]
Measure=Registry
RegHKey=HKEY_CURRENT_USER
RegKey=#AIDAKey#
RegValue=#AIDA_GPUUtil#
MinValue=0
MaxValue=100

[MeasureGPUTemp]
Measure=Registry
RegHKey=HKEY_CURRENT_USER
RegKey=#AIDAKey#
RegValue=#AIDA_GPUTemp#

[MeasureVRAMPercent]
Measure=Registry
RegHKey=HKEY_CURRENT_USER
RegKey=#AIDAKey#
RegValue=#AIDA_GPUVRAMPercent#
MinValue=0
MaxValue=100

[MeasureVRAMUsed]
Measure=Registry
RegHKey=HKEY_CURRENT_USER
RegKey=#AIDAKey#
RegValue=#AIDA_GPUVRAMUsed#

[MeasureVRAMFree]
Measure=Registry
RegHKey=HKEY_CURRENT_USER
RegKey=#AIDAKey#
RegValue=#AIDA_GPUVRAMFree#

[MeasureVRAMTotal]
Measure=Calc
Formula=MeasureVRAMUsed + MeasureVRAMFree
DynamicVariables=1

[MeasureFPS]
Measure=Registry
RegHKey=HKEY_CURRENT_USER
RegKey=#AIDAKey#
RegValue=#AIDA_FPS#

[MeasureMEMClock]
Measure=Registry
RegHKey=HKEY_CURRENT_USER
RegKey=#AIDAKey#
RegValue=#AIDA_MEMClock#

[MeasureMEMUtil]
Measure=Registry
RegHKey=HKEY_CURRENT_USER
RegKey=#AIDAKey#
RegValue=#AIDA_MEMUtil#
MinValue=0
MaxValue=100

[MeasureMEMUsed]
Measure=Registry
RegHKey=HKEY_CURRENT_USER
RegKey=#AIDAKey#
RegValue=#AIDA_MEMUsed#

[MeasureMEMFree]
Measure=Registry
RegHKey=HKEY_CURRENT_USER
RegKey=#AIDAKey#
RegValue=#AIDA_MEMFree#

[MeasureMEMTotal]
Measure=Calc
Formula=MeasureMEMUsed + MeasureMEMFree
DynamicVariables=1

; ---------- Network ----------
[MeasureNetIn]
Measure=NetIn
Interface=Best
MinValue=0

[MeasureNetOut]
Measure=NetOut
Interface=Best
MinValue=0

[MeasureNetInMbit]
Measure=Calc
Formula=MeasureNetIn * 8 / 1000000
DynamicVariables=1

[MeasureNetOutMbit]
Measure=Calc
Formula=MeasureNetOut * 8 / 1000000
DynamicVariables=1

[MeasureNetLinkSpeed]
Measure=SysInfo
SysInfoType=NET_LINK_SPEED
UpdateDivider=-1

[MeasureNetLinkMbit]
Measure=Calc
Formula=MeasureNetLinkSpeed / 1000000
DynamicVariables=1

; ---------- Processes ----------
[MeasureProcCpu]
Measure=Plugin
Plugin=UsageMonitor
Alias=CPU
Index=1
Rollup=1
Blacklist=#ProcBlacklist#

[MeasureProcGpu]
Measure=Plugin
Plugin=UsageMonitor
Alias=GPU
Index=1
Rollup=1
Blacklist=#ProcBlacklist#

[MeasureProcMem]
Measure=Plugin
Plugin=UsageMonitor
Alias=RAM
Index=1
Rollup=1
Blacklist=#ProcBlacklist#

[MeasureProcMemCalc]
Measure=Calc
Formula=MeasureProcMem

; ---------- Glances ----------
[GlancesCPUApi]
Measure=WebParser
URL=#GlancesCPUUrl#
UpdateRate=#GlancesUpdateRate#
RegExp=(?si).*"total"\s*:\s*([0-9.]+).*"cpucore"\s*:\s*([0-9]+).*
SSLVerify=#GlancesSSLVerify#

[GlancesCPUTotal]
Measure=WebParser
URL=[GlancesCPUApi]
StringIndex=1
MinValue=0
MaxValue=100

[GlancesCPUCores]
Measure=WebParser
URL=[GlancesCPUApi]
StringIndex=2

[GlancesGPUApi]
Measure=WebParser
URL=#GlancesGPUUrl#
UpdateRate=#GlancesUpdateRate#
RegExp=(?si).*"name"\s*:\s*"([^"]+)".*"mem"\s*:\s*(null|[0-9.]+).*"proc"\s*:\s*(null|[0-9.]+).*
SSLVerify=#GlancesSSLVerify#

[GlancesGPUName]
Measure=WebParser
URL=[GlancesGPUApi]
StringIndex=1

[GlancesGPUMemPercent]
Measure=WebParser
URL=[GlancesGPUApi]
StringIndex=2
Substitute="null":"0"
MinValue=0
MaxValue=100

[GlancesGPUProcPercent]
Measure=WebParser
URL=[GlancesGPUApi]
StringIndex=3
Substitute="null":"0"
MinValue=0
MaxValue=100

[GlancesMEMApi]
Measure=WebParser
URL=#GlancesMEMUrl#
UpdateRate=#GlancesUpdateRate#
RegExp=(?si).*"total"\s*:\s*([0-9]+).*"percent"\s*:\s*([0-9.]+).*"used"\s*:\s*([0-9]+).*
SSLVerify=#GlancesSSLVerify#

[GlancesMEMTotalBytes]
Measure=WebParser
URL=[GlancesMEMApi]
StringIndex=1

[GlancesMEMPercent]
Measure=WebParser
URL=[GlancesMEMApi]
StringIndex=2
MinValue=0
MaxValue=100

[GlancesMEMUsedBytes]
Measure=WebParser
URL=[GlancesMEMApi]
StringIndex=3

[GlancesMEMTotalGB]
Measure=Calc
Formula=GlancesMEMTotalBytes / 1073741824
DynamicVariables=1

[GlancesMEMUsedGB]
Measure=Calc
Formula=GlancesMEMUsedBytes / 1073741824
DynamicVariables=1

[GlancesNetApi]
Measure=WebParser
URL=#GlancesNETWORKUrl#
UpdateRate=#GlancesUpdateRate#
RegExp=(?si).*"speed"\s*:\s*([0-9]+).*"bytes_recv_rate_per_sec"\s*:\s*([0-9.]+).*"bytes_sent_rate_per_sec"\s*:\s*([0-9.]+).*
SSLVerify=#GlancesSSLVerify#

[GlancesNetSpeedBps]
Measure=WebParser
URL=[GlancesNetApi]
StringIndex=1

[GlancesNetDownBps]
Measure=WebParser
URL=[GlancesNetApi]
StringIndex=2

[GlancesNetUpBps]
Measure=WebParser
URL=[GlancesNetApi]
StringIndex=3

[GlancesNetSpeedMbit]
Measure=Calc
Formula=GlancesNetSpeedBps / 1000000
DynamicVariables=1

[GlancesNetDownMbit]
Measure=Calc
Formula=GlancesNetDownBps * 8 / 1000000
DynamicVariables=1

[GlancesNetUpMbit]
Measure=Calc
Formula=GlancesNetUpBps * 8 / 1000000
DynamicVariables=1

[GlancesProcessListApi]
Measure=WebParser
URL=#GlancesPROCESSESUrl#
UpdateRate=#GlancesUpdateRate#
RegExp=(?s)^(.+)$
SSLVerify=#GlancesSSLVerify#

[GlancesProcessListJson]
Measure=WebParser
URL=[GlancesProcessListApi]
StringIndex=1

[GlancesCpuProcScript]
Measure=Script
ScriptFile=#@#Scripts\GlancesProcesses.lua
SourceMeasure=GlancesProcessListJson
SortField=cpu_percent
TopCount=3
Blacklist=#GlancesProcBlacklist#
Debug=0
UpdateDivider=1

[GlancesMemProcScript]
Measure=Script
ScriptFile=#@#Scripts\GlancesProcesses.lua
SourceMeasure=GlancesProcessListJson
SortField=rss
TopCount=3
Blacklist=#GlancesProcBlacklist#
Debug=0
UpdateDivider=1

; ---------- Shell ----------
[MeterBg]
Meter=Shape
MeterStyle=StyleBg

; Band separators
[BandSep1]
Meter=Shape
Shape=Line #Padding#,#B2Y#,(#PanelWidth#-#Padding#),#B2Y# | StrokeWidth 1 | Stroke Color 90,90,90,255

[BandSep2]
Meter=Shape
Shape=Line #Padding#,#B3Y#,(#PanelWidth#-#Padding#),#B3Y# | StrokeWidth 1 | Stroke Color 90,90,90,255

[BandSep3]
Meter=Shape
Shape=Line #Padding#,#B4Y#,(#PanelWidth#-#Padding#),#B4Y# | StrokeWidth 1 | Stroke Color 90,90,90,255

[ColSepB1]
Meter=Shape
Shape=Line #ColHalfW#,#B1Y#,#ColHalfW#,(#B1Y#+#B1H#) | StrokeWidth 1 | Stroke Color 90,90,90,255

[ColSepB2a]
Meter=Shape
Shape=Line #ColThirdW#,#B2Y#,#ColThirdW#,(#B2Y#+#B2H#) | StrokeWidth 1 | Stroke Color 90,90,90,255

[ColSepB2b]
Meter=Shape
Shape=Line (#ColThirdW#*2),#B2Y#,(#ColThirdW#*2),(#B2Y#+#B2H#) | StrokeWidth 1 | Stroke Color 90,90,90,255

[ColSepB3]
Meter=Shape
Shape=Line #ColHalfW#,#B3Y#,#ColHalfW#,(#B3Y#+#B3H#) | StrokeWidth 1 | Stroke Color 90,90,90,255

[ColSepB5a]
Meter=Shape
Shape=Line #ColQuarterW#,#B5Y#,#ColQuarterW#,#B5ProcTop# | StrokeWidth 1 | Stroke Color 90,90,90,255

[ColSepB5b]
Meter=Shape
Shape=Line (#ColQuarterW#*2),#B5Y#,(#ColQuarterW#*2),#B5ProcTop# | StrokeWidth 1 | Stroke Color 90,90,90,255

[ColSepB5c]
Meter=Shape
Shape=Line (#ColQuarterW#*3),#B5Y#,(#ColQuarterW#*3),#B5ProcTop# | StrokeWidth 1 | Stroke Color 90,90,90,255

[GlancesProcSep]
Meter=Shape
Shape=Line #Padding#,#B5ProcTop#,(#PanelWidth#-#Padding#),#B5ProcTop# | StrokeWidth 1 | Stroke Color 90,90,90,255

[GlancesProcColSep]
Meter=Shape
Shape=Line #ColHalfW#,#B5ProcTop#,#ColHalfW#,(#B5Y#+#B5H#) | StrokeWidth 1 | Stroke Color 90,90,90,255

; ========================= CPU =========================
[CpuTitle]
Meter=String
MeterStyle=StyleSecTitle
X=#Half1X#
Y=#B1Top#
Text=CPU

[CpuDiv]
Meter=Image
SolidColor=#ColorDivider#
X=#Half1X#
Y=(#B1Top#+#SecTitleH#+4)
W=#Half1W#
H=1

[CpuLabelUtil]
Meter=String
MeterStyle=StyleSecLabel
X=#Half1X#
Y=#B1Util1Y#
Text=Utilization

[CpuValueUtil]
Meter=String
