[GpuValueUtil]
Meter=String
MeterStyle=StyleSecValue
X=(#Half2X#+#Half2W#)
Y=#B1Util1Y#
MeasureName=MeasureGPUUtil
Text=%1%

[GpuBarUtilBg]
Meter=Image
SolidColor=#ColorBarBg#
X=#Half2X#
Y=#B1Util1BarY#
W=#Half2W#
H=#BarH#

[GpuBarUtil]
Meter=Bar
MeasureName=MeasureGPUUtil
BarColor=#ColorBar#
BarOrientation=Horizontal
X=#Half2X#
Y=#B1Util1BarY#
W=#Half2W#
H=#BarH#

[GpuGraphUtilBg]
Meter=Shape
Shape=Rectangle #Half2X#,#B1Util1GraphY#,#Half2W#,#GraphH#,#GraphRadius# | Fill Color #ColorGraphBg# | StrokeWidth 1 | Stroke Color #ColorBorder#

[GpuGraphUtil]
Meter=Line
MeasureName=MeasureGPUUtil
X=#Half2X#
Y=#B1Util1GraphY#
W=#Half2W#
H=#GraphH#
LineColor=#ColorGraph1#
LineWidth=2
AntiAlias=1
AutoScale=0
HorizontalLines=3
HorizontalLineColor=#ColorGraphGrid#

[GpuLabelTemp]
Meter=String
MeterStyle=StyleSecLabel
X=#Half2X#
Y=#B1Temp1Y#
Text=Temperature

[GpuValueTemp]
Meter=String
MeterStyle=StyleSecValue
X=(#Half2X#+#Half2W#)
Y=#B1Temp1Y#
MeasureName=MeasureGPUTemp
Text=%1 [\x00B0]C

[GpuGraphTempBg]
Meter=Shape
Shape=Rectangle #Half2X#,#B1Temp1GraphY#,#Half2W#,#GraphH#,#GraphRadius# | Fill Color #ColorGraphBg# | StrokeWidth 1 | Stroke Color #ColorBorder#

[GpuGraphTemp]
Meter=Line
MeasureName=MeasureGPUTemp
X=#Half2X#
Y=#B1Temp1GraphY#
W=#Half2W#
H=#GraphH#
LineColor=#ColorGraph2#
LineWidth=2
AntiAlias=1
AutoScale=1
HorizontalLines=3
HorizontalLineColor=#ColorGraphGrid#

; ========================= VRAM =========================
[VramTitle]
Meter=String
MeterStyle=StyleSecTitle
X=#Third1X#
Y=#B2Top#
Text=VRAM

[VramDiv]
Meter=Image
SolidColor=#ColorDivider#
X=#Third1X#
Y=(#B2Top#+#SecTitleH#+4)
W=#ThirdW#
H=1

[VramLabel]
