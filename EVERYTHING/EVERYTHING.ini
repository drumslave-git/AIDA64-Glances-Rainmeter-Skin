X=#Third3X#
Y=(#B2Top#+#SecTitleH#+4)
W=#ThirdW#
H=1

[MemLabelClock]
Meter=String
MeterStyle=StyleSecLabel
X=#Third3X#
Y=#B2MemClockY#
Text=Speed

[MemValueClock]
Meter=String
MeterStyle=StyleSecValue
X=(#Third3X#+#ThirdW#)
Y=#B2MemClockY#
MeasureName=MeasureMEMClock
Text=%1 MHz

[MemLabel]
Meter=String
MeterStyle=StyleSecLabel
X=#Third3X#
Y=#B2MemRowY#
Text=Memory

[MemValue]
