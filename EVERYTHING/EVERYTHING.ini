X=#Third3X#
Y=#B2MemBarY#
W=#ThirdW#
H=#BarH#

[MemBar]
Meter=Bar
MeasureName=MeasureMEMUtil
BarColor=#ColorBar#
BarOrientation=Horizontal
X=#Third3X#
Y=#B2MemBarY#
W=#ThirdW#
H=#BarH#

[MemGraphBg]
