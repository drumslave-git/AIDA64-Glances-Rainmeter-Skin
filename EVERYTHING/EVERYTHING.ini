[Rainmeter]
Update=#UpdateMs#
AccurateText=1
DynamicWindowSize=1
@include=#@#Variables.inc
@include2=#@#Styles.inc

[Variables]
CELLS_COUNT=4
ROWS_COUNT=4

; ---------- EVERYTHING layout grid (1920 x 1232) ----------
BandGap=14
B1Y=#Padding#
B1H=300
B2Y=(#B1Y#+#B1H#+#BandGap#)
B2H=268
B3Y=(#B2Y#+#B2H#+#BandGap#)
B3H=212
B4Y=(#B3Y#+#B3H#+#BandGap#)
B4H=104
B5Y=(#B4Y#+#B4H#+#BandGap#)
B5H=(#PanelHeight#-#B5Y#-#Padding#)

ColHalfW=(#PanelWidth#/2)
ColThirdW=(#PanelWidth#/3)
Half1X=#Padding#
Half1W=(#ColHalfW#-(#Padding#*2))
Half2X=(#ColHalfW#+#Padding#)
Half2W=#Half1W#
Third1X=#Padding#
Third2X=#ColThirdW#
Third3X=(#ColThirdW#*2)
ThirdW=(#ColThirdW#-(#Padding#*2))
FullW=(#PanelWidth#-(#Padding#*2))

GraphH=56
GraphHSm=52
SecTitleH=26
SecHeadH=(#SecTitleH#+12)

; Band 1 — CPU / GPU (two util+temp graph stacks)
B1Top=(#B1Y#+12)
B1Util1Y=(#B1Top#+#SecHeadH#)
B1Util1BarY=(#B1Util1Y#+#BarOffsetY#)
B1Util1GraphY=(#B1Util1Y#+#LineH#+8)
B1Temp1Y=(#B1Util1GraphY#+#GraphH#+16)
B1Temp1GraphY=(#B1Temp1Y#+#LineH#+8)

; Band 2 — VRAM | FPS | MEM (graphs anchored to band bottom)
B2Top=(#B2Y#+12)
B2GraphY=(#B2Y#+#B2H#-#GraphH#-#Padding#)
B2FpsValueY=((#B2Top#+#SecHeadH#+#B2GraphY#)/2)
B2VramRowY=(#B2Top#+#SecHeadH#)
B2VramBarY=(#B2VramRowY#+#BarOffsetY#)
B2MemClockY=(#B2Top#+#SecHeadH#)
B2MemRowY=(#B2MemClockY#+#LineH#)
B2MemBarY=(#B2MemRowY#+#BarOffsetY#)

; Band 3 — NETWORK (metrics left, graph right)
B3Top=(#B3Y#+12)
B3NetTextW=500
B3GraphX=(#Padding#+#B3NetTextW#+#Padding#)
B3GraphW=(#PanelWidth#-#B3GraphX#-#Padding#)
B3GraphY=(#B3Top#+#SecHeadH#)
B3GraphH=(#B3Y#+#B3H#-#B3GraphY#-#Padding#)
B3LinkY=(#B3Top#+#SecHeadH#)
B3DownY=(#B3LinkY#+#LineH#)
B3UpY=(#B3DownY#+#LineH#)

; Band 4 — top processes
B4Top=(#B4Y#+12)
B4RowY=(#B4Top#+#SecHeadH#+4)
ProcNameW=((#ColThirdW#-(#Padding#*3))-120)

ProcBlacklist=_Total|Idle|dwm|csrss|svchost|lsass|System|system|Memory Compression|wininit|spoolsv|Registry|Secure System

[StyleSecTitle]
FontFace=#FontName#
FontSize=22
FontColor=#ColorTitle#
StringStyle=Bold
AntiAlias=1
StringCase=Upper

[StyleSecLabel]
FontFace=#FontName#
FontSize=20
FontColor=#ColorText#
AntiAlias=1
StringAlign=Left

[StyleSecValue]
FontFace=#FontName#
FontSize=20
FontColor=#ColorText#
AntiAlias=1
StringAlign=Right

[StyleProcName]
FontFace=#FontName#
FontSize=16
FontColor=#ColorMuted#
AntiAlias=1
StringAlign=Left
ClipString=2

; ---------- AIDA64 ----------
[MeasureCPUUtil]
Measure=Registry
RegHKey=HKEY_CURRENT_USER
RegKey=#AIDAKey#
RegValue=#AIDA_CPUUtil#
MinValue=0
MaxValue=100

[MeasureCPUTemp]
Measure=Registry
RegHKey=HKEY_CURRENT_USER
RegKey=#AIDAKey#
RegValue=#AIDA_CPUTemp#

[MeasureGPUUtil]
Measure=Registry
RegHKey=HKEY_CURRENT_USER
RegKey=#AIDAKey#
RegValue=#AIDA_GPUUtil#
MinValue=0
MaxValue=100

[MeasureGPUTemp]
Measure=Registry
RegHKey=HKEY_CURRENT_USER
RegKey=#AIDAKey#
RegValue=#AIDA_GPUTemp#

[MeasureVRAMPercent]
Measure=Registry
RegHKey=HKEY_CURRENT_USER
RegKey=#AIDAKey#
RegValue=#AIDA_GPUVRAMPercent#
MinValue=0
MaxValue=100

[MeasureVRAMUsed]
Measure=Registry
RegHKey=HKEY_CURRENT_USER
RegKey=#AIDAKey#
RegValue=#AIDA_GPUVRAMUsed#

[MeasureVRAMFree]
Measure=Registry
RegHKey=HKEY_CURRENT_USER
RegKey=#AIDAKey#
RegValue=#AIDA_GPUVRAMFree#

[MeasureVRAMTotal]
Measure=Calc
Formula=MeasureVRAMUsed + MeasureVRAMFree
DynamicVariables=1

[MeasureFPS]
Measure=Registry
RegHKey=HKEY_CURRENT_USER
RegKey=#AIDAKey#
RegValue=#AIDA_FPS#

[MeasureMEMClock]
Measure=Registry
RegHKey=HKEY_CURRENT_USER
RegKey=#AIDAKey#
RegValue=#AIDA_MEMClock#

[MeasureMEMUtil]
Measure=Registry
RegHKey=HKEY_CURRENT_USER
RegKey=#AIDAKey#
RegValue=#AIDA_MEMUtil#
MinValue=0
MaxValue=100

[MeasureMEMUsed]
Measure=Registry
RegHKey=HKEY_CURRENT_USER
RegKey=#AIDAKey#
RegValue=#AIDA_MEMUsed#

[MeasureMEMFree]
Measure=Registry
RegHKey=HKEY_CURRENT_USER
RegKey=#AIDAKey#
RegValue=#AIDA_MEMFree#

[MeasureMEMTotal]
Measure=Calc
Formula=MeasureMEMUsed + MeasureMEMFree
DynamicVariables=1

; ---------- Network ----------
[MeasureNetIn]
Measure=NetIn
Interface=Best
MinValue=0

[MeasureNetOut]
Measure=NetOut
Interface=Best
MinValue=0

[MeasureNetInMbit]
Measure=Calc
Formula=MeasureNetIn * 8 / 1000000
DynamicVariables=1

[MeasureNetOutMbit]
Measure=Calc
Formula=MeasureNetOut * 8 / 1000000
DynamicVariables=1

[MeasureNetLinkSpeed]
Measure=SysInfo
SysInfoType=NET_LINK_SPEED
UpdateDivider=-1

[MeasureNetLinkMbit]
Measure=Calc
Formula=MeasureNetLinkSpeed / 1000000
DynamicVariables=1

; ---------- Processes ----------
[MeasureProcCpu]
Measure=Plugin
Plugin=UsageMonitor
Alias=CPU
Index=1
Rollup=1
Blacklist=#ProcBlacklist#

[MeasureProcGpu]
Measure=Plugin
Plugin=UsageMonitor
Alias=GPU
Index=1
Rollup=1
Blacklist=#ProcBlacklist#

[MeasureProcMem]
Measure=Plugin
Plugin=UsageMonitor
Alias=RAM
Index=1
Rollup=1
Blacklist=#ProcBlacklist#

[MeasureProcMemCalc]
Measure=Calc
Formula=MeasureProcMem

; ---------- Shell ----------
[MeterBg]
Meter=Shape
MeterStyle=StyleBg

; Band separators
[BandSep1]
Meter=Shape
Shape=Line #Padding#,#B2Y#,(#PanelWidth#-#Padding#),#B2Y# | StrokeWidth 1 | Stroke Color 90,90,90,255

[BandSep2]
Meter=Shape
Shape=Line #Padding#,#B3Y#,(#PanelWidth#-#Padding#),#B3Y# | StrokeWidth 1 | Stroke Color 90,90,90,255

[BandSep3]
Meter=Shape
Shape=Line #Padding#,#B4Y#,(#PanelWidth#-#Padding#),#B4Y# | StrokeWidth 1 | Stroke Color 90,90,90,255

[BandSep4]
Meter=Shape
Shape=Line #Padding#,#B5Y#,(#PanelWidth#-#Padding#),#B5Y# | StrokeWidth 1 | Stroke Color 90,90,90,255

[ColSepB1]
Meter=Shape
Shape=Line #ColHalfW#,#B1Y#,#ColHalfW#,(#B1Y#+#B1H#) | StrokeWidth 1 | Stroke Color 90,90,90,255

[ColSepB2a]
Meter=Shape
Shape=Line #ColThirdW#,#B2Y#,#ColThirdW#,(#B2Y#+#B2H#) | StrokeWidth 1 | Stroke Color 90,90,90,255

[ColSepB2b]
Meter=Shape
Shape=Line (#ColThirdW#*2),#B2Y#,(#ColThirdW#*2),(#B2Y#+#B2H#) | StrokeWidth 1 | Stroke Color 90,90,90,255

; ========================= CPU =========================
[CpuTitle]
Meter=String
MeterStyle=StyleSecTitle
X=#Half1X#
Y=#B1Top#
Text=CPU

[CpuDiv]
Meter=Image
SolidColor=#ColorDivider#
X=#Half1X#
Y=(#B1Top#+#SecTitleH#+4)
W=#Half1W#
H=1

[CpuLabelUtil]
Meter=String
MeterStyle=StyleSecLabel
X=#Half1X#
Y=#B1Util1Y#
Text=Utilization

[CpuValueUtil]
Meter=String
MeterStyle=StyleSecValue
X=(#Half1X#+#Half1W#)
Y=#B1Util1Y#
MeasureName=MeasureCPUUtil
Text=%1%

[CpuBarUtilBg]
Meter=Image
SolidColor=#ColorBarBg#
X=#Half1X#
Y=#B1Util1BarY#
W=#Half1W#
H=#BarH#

[CpuBarUtil]
Meter=Bar
MeasureName=MeasureCPUUtil
BarColor=#ColorBar#
BarOrientation=Horizontal
X=#Half1X#
Y=#B1Util1BarY#
W=#Half1W#
H=#BarH#

[CpuGraphUtilBg]
Meter=Shape
Shape=Rectangle #Half1X#,#B1Util1GraphY#,#Half1W#,#GraphH#,#GraphRadius# | Fill Color #ColorGraphBg# | StrokeWidth 1 | Stroke Color #ColorBorder#

[CpuGraphUtil]
Meter=Line
MeasureName=MeasureCPUUtil
X=#Half1X#
Y=#B1Util1GraphY#
W=#Half1W#
H=#GraphH#
LineColor=#ColorGraph1#
LineWidth=2
AntiAlias=1
AutoScale=0
HorizontalLines=3
HorizontalLineColor=#ColorGraphGrid#

[CpuLabelTemp]
Meter=String
MeterStyle=StyleSecLabel
X=#Half1X#
Y=#B1Temp1Y#
Text=Temperature

[CpuValueTemp]
Meter=String
MeterStyle=StyleSecValue
X=(#Half1X#+#Half1W#)
Y=#B1Temp1Y#
MeasureName=MeasureCPUTemp
Text=%1 [\x00B0]C

[CpuGraphTempBg]
Meter=Shape
Shape=Rectangle #Half1X#,#B1Temp1GraphY#,#Half1W#,#GraphH#,#GraphRadius# | Fill Color #ColorGraphBg# | StrokeWidth 1 | Stroke Color #ColorBorder#

[CpuGraphTemp]
Meter=Line
MeasureName=MeasureCPUTemp
X=#Half1X#
Y=#B1Temp1GraphY#
W=#Half1W#
H=#GraphH#
LineColor=#ColorGraph2#
LineWidth=2
AntiAlias=1
AutoScale=1
HorizontalLines=3
HorizontalLineColor=#ColorGraphGrid#

; ========================= GPU =========================
[GpuTitle]
Meter=String
MeterStyle=StyleSecTitle
X=#Half2X#
Y=#B1Top#
Text=GPU

[GpuDiv]
Meter=Image
SolidColor=#ColorDivider#
X=#Half2X#
Y=(#B1Top#+#SecTitleH#+4)
W=#Half2W#
H=1

[GpuLabelUtil]
Meter=String
MeterStyle=StyleSecLabel
X=#Half2X#
