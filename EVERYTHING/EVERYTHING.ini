[VramBarBg]
Meter=Image
SolidColor=#ColorBarBg#
X=#Third1X#
Y=#B2VramBarY#
W=#ThirdW#
H=#BarH#

[VramBar]
Meter=Bar
MeasureName=MeasureVRAMPercent
BarColor=#ColorBar#
BarOrientation=Horizontal
X=#Third1X#
Y=#B2VramBarY#
W=#ThirdW#
H=#BarH#

[VramGraphBg]
Meter=Shape
Shape=Rectangle #Third1X#,#B2GraphY#,#ThirdW#,#GraphH#,#GraphRadius# | Fill Color #ColorGraphBg# | StrokeWidth 1 | Stroke Color #ColorBorder#

[VramGraph]
Meter=Line
MeasureName=MeasureVRAMPercent
X=#Third1X#
Y=#B2GraphY#
W=#ThirdW#
H=#GraphH#
LineColor=#ColorGraph1#
LineWidth=2
AntiAlias=1
AutoScale=0
HorizontalLines=3
