; ========================= NETWORK =========================
[NetTitle]
Meter=String
MeterStyle=StyleSecTitle
X=#Padding#
Y=#B3Top#
Text=NETWORK

[NetDiv]
Meter=Image
SolidColor=#ColorDivider#
X=#Padding#
Y=(#B3Top#+#SecTitleH#+4)
W=#B3NetTextW#
H=1

[NetLabelLink]
Meter=String
MeterStyle=StyleSecLabel
X=#Padding#
Y=#B3LinkY#
Text=Link

[NetValueLink]
