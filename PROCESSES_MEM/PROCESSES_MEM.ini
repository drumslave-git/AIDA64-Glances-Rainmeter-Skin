[Rainmeter]
Update=#UpdateMs#
AccurateText=1
DynamicWindowSize=1
@include=#@#Variables.inc
@include2=#@#Styles.inc

[Variables]
ColGap=14
ProcValRight=(#PanelWidth#-#Padding#)
ProcNameW=(#ProcValRight#-#LabelX#-#ColGap#)
ProcBlacklist=_Total|Idle|dwm|csrss|svchost|lsass|System|system|Memory Compression|wininit|spoolsv|Registry|Secure System

[StyleProcName]
FontFace=#FontName#
FontSize=14
FontColor=#ColorMuted#
AntiAlias=1
StringAlign=Left
ClipString=2

[MeasureProc1]
Measure=Plugin
Plugin=UsageMonitor
Alias=RAM
Index=1
Rollup=1
Blacklist=#ProcBlacklist#

[MeasureProc2]
Measure=Plugin
Plugin=UsageMonitor
Alias=RAM
Index=2
Rollup=1
Blacklist=#ProcBlacklist#

[MeasureProc3]
Measure=Plugin
Plugin=UsageMonitor
Alias=RAM
Index=3
Rollup=1
Blacklist=#ProcBlacklist#

[MeasureProc4]
Measure=Plugin
Plugin=UsageMonitor
Alias=RAM
Index=4
Rollup=1
Blacklist=#ProcBlacklist#

[MeasureProc5]
Measure=Plugin
Plugin=UsageMonitor
Alias=RAM
Index=5
Rollup=1
Blacklist=#ProcBlacklist#

[MeasureProc1Calc]
Measure=Calc
Formula=MeasureProc1

[MeasureProc2Calc]
Measure=Calc
Formula=MeasureProc2

[MeasureProc3Calc]
Measure=Calc
Formula=MeasureProc3

[MeasureProc4Calc]
Measure=Calc
Formula=MeasureProc4

[MeasureProc5Calc]
Measure=Calc
Formula=MeasureProc5

[MeterBg]
Meter=Shape
MeterStyle=StyleBg

[MeterTitle]
Meter=String
MeterStyle=StyleTitle
Text=PROCESSES MEM

[Divider]
Meter=Image
MeterStyle=StyleDivider
X=#DividerX#
Y=#DividerY#

[Proc1Name]
Meter=String
MeterStyle=StyleProcName
X=#LabelX#
Y=(#LineH#*2)
W=#ProcNameW#
MeasureName=MeasureProc1
Text=%1

[Proc1Val]
Meter=String
MeterStyle=StyleValue
X=#ProcValRight#
Y=(#LineH#*2)
FontSize=18
MeasureName=MeasureProc1Calc
AutoScale=1
NumOfDecimals=0
Text=%1B

[Proc2Name]
Meter=String
MeterStyle=StyleProcName
X=#LabelX#
Y=(#LineH#*3)
W=#ProcNameW#
MeasureName=MeasureProc2
Text=%1

[Proc2Val]
Meter=String
MeterStyle=StyleValue
X=#ProcValRight#
Y=(#LineH#*3)
FontSize=18
MeasureName=MeasureProc2Calc
AutoScale=1
NumOfDecimals=0
Text=%1B

[Proc3Name]
Meter=String
MeterStyle=StyleProcName
X=#LabelX#
Y=(#LineH#*4)
W=#ProcNameW#
MeasureName=MeasureProc3
Text=%1

[Proc3Val]
Meter=String
MeterStyle=StyleValue
X=#ProcValRight#
Y=(#LineH#*4)
FontSize=18
MeasureName=MeasureProc3Calc
AutoScale=1
NumOfDecimals=0
Text=%1B

[Proc4Name]
Meter=String
MeterStyle=StyleProcName
X=#LabelX#
Y=(#LineH#*5)
W=#ProcNameW#
MeasureName=MeasureProc4
Text=%1

[Proc4Val]
Meter=String
MeterStyle=StyleValue
X=#ProcValRight#
Y=(#LineH#*5)
FontSize=18
MeasureName=MeasureProc4Calc
AutoScale=1
NumOfDecimals=0
Text=%1B

[Proc5Name]
Meter=String
MeterStyle=StyleProcName
X=#LabelX#
Y=(#LineH#*6)
W=#ProcNameW#
MeasureName=MeasureProc5
Text=%1

[Proc5Val]
Meter=String
MeterStyle=StyleValue
X=#ProcValRight#
Y=(#LineH#*6)
FontSize=18
MeasureName=MeasureProc5Calc
AutoScale=1
NumOfDecimals=0
Text=%1B
