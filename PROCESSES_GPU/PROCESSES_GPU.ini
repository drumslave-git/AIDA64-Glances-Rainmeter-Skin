[Rainmeter]
Update=#UpdateMs#
AccurateText=1
DynamicWindowSize=1
@include=#@#Variables.inc
@include2=#@#Styles.inc

[Variables]
ColGap=14
ProcValRight=(#PanelWidth#-#Padding#)
ProcNameW=(#ProcValRight#-#LabelX#-#ColGap#)
ProcBlacklist=_Total|Idle|dwm|csrss|svchost|lsass|System|system|Memory Compression|wininit|spoolsv|Registry|Secure System

[StyleProcName]
FontFace=#FontName#
FontSize=14
FontColor=#ColorMuted#
AntiAlias=1
StringAlign=Left
ClipString=2

[MeasureProc1]
Measure=Plugin
Plugin=UsageMonitor
Alias=GPU
Index=1
Rollup=1
Blacklist=#ProcBlacklist#

[MeasureProc2]
Measure=Plugin
Plugin=UsageMonitor
Alias=GPU
Index=2
Rollup=1
Blacklist=#ProcBlacklist#

[MeasureProc3]
Measure=Plugin
Plugin=UsageMonitor
Alias=GPU
Index=3
Rollup=1
Blacklist=#ProcBlacklist#

[MeasureProc4]
Measure=Plugin
Plugin=UsageMonitor
Alias=GPU
Index=4
Rollup=1
Blacklist=#ProcBlacklist#

[MeasureProc5]
Measure=Plugin
Plugin=UsageMonitor
Alias=GPU
Index=5
Rollup=1
Blacklist=#ProcBlacklist#

[MeterBg]
Meter=Shape
MeterStyle=StyleBg

[MeterTitle]
Meter=String
MeterStyle=StyleTitle
Text=PROCESSES GPU

[Divider]
Meter=Image
MeterStyle=StyleDivider
X=#DividerX#
Y=#DividerY#

[Proc1Name]
Meter=String
MeterStyle=StyleProcName
X=#LabelX#
Y=(#LineH#*2)
W=#ProcNameW#
MeasureName=MeasureProc1
Text=%1

[Proc1Val]
Meter=String
MeterStyle=StyleValue
X=#ProcValRight#
Y=(#LineH#*2)
FontSize=18
DynamicVariables=1
Text=[MeasureProc1:1]%

[Proc2Name]
Meter=String
MeterStyle=StyleProcName
X=#LabelX#
Y=(#LineH#*3)
W=#ProcNameW#
MeasureName=MeasureProc2
Text=%1

[Proc2Val]
Meter=String
MeterStyle=StyleValue
X=#ProcValRight#
Y=(#LineH#*3)
FontSize=18
DynamicVariables=1
Text=[MeasureProc2:1]%

[Proc3Name]
Meter=String
MeterStyle=StyleProcName
X=#LabelX#
Y=(#LineH#*4)
W=#ProcNameW#
MeasureName=MeasureProc3
Text=%1

[Proc3Val]
Meter=String
MeterStyle=StyleValue
X=#ProcValRight#
Y=(#LineH#*4)
FontSize=18
DynamicVariables=1
Text=[MeasureProc3:1]%

[Proc4Name]
Meter=String
MeterStyle=StyleProcName
X=#LabelX#
Y=(#LineH#*5)
W=#ProcNameW#
MeasureName=MeasureProc4
Text=%1

[Proc4Val]
Meter=String
MeterStyle=StyleValue
X=#ProcValRight#
Y=(#LineH#*5)
FontSize=18
DynamicVariables=1
Text=[MeasureProc4:1]%

[Proc5Name]
Meter=String
MeterStyle=StyleProcName
X=#LabelX#
Y=(#LineH#*6)
W=#ProcNameW#
MeasureName=MeasureProc5
Text=%1

[Proc5Val]
Meter=String
MeterStyle=StyleValue
X=#ProcValRight#
Y=(#LineH#*6)
FontSize=18
DynamicVariables=1
Text=[MeasureProc5:1]%
